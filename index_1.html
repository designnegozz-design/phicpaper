<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phic Paper — Links</title>
<meta name="description" content="Todos os links da Phic Paper em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf5ec;
    --paper-line:#e8dfcd;
    --ink:#2c2733;
    --ink-soft:#5c5566;
    --plum:#6d2c54;
    --plum-dark:#4f1f3d;
    --mustard:#e3ab30;
    --sage:#7f9b74;
    --blush:#e2a1a1;
    --sky:#5b83a6;
    --radius:18px;
    --shadow: 0 10px 30px -12px rgba(44,39,51,0.25);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at top left, rgba(109,44,84,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(227,171,48,0.08), transparent 55%),
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    background-attachment: fixed;
    font-family:'Plus Jakarta Sans', sans-serif;
    color:var(--ink);
  }

  body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left:56px;
    width:2px;
    background:rgba(224,140,140,0.35);
    z-index:0;
    pointer-events:none;
  }
  @media (max-width:600px){ body::before{ left:34px; } }

  .wrap{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    padding:56px 24px 100px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .avatar-holder{
    position:relative;
    width:112px;
    height:112px;
    margin-bottom:22px;
  }
  .avatar{
    width:100%;
    height:100%;
    border-radius:14px;
    background:linear-gradient(135deg,var(--plum),var(--sky));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:'Caveat',cursive;
    font-size:52px;
    font-weight:700;
    box-shadow:var(--shadow);
    transform:rotate(-3deg);
    border:4px solid #fff;
  }
  .tape{
    position:absolute;
    width:70px;
    height:26px;
    background:rgba(227,171,48,0.55);
    border:1px solid rgba(227,171,48,0.7);
    top:-14px;
    left:50%;
    transform:translateX(-50%) rotate(-6deg);
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .tape::before, .tape::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:6px;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 2px, transparent 2px 4px);
  }
  .tape::before{ left:0; }
  .tape::after{ right:0; }

  h1.name{
    font-family:'Caveat',cursive;
    font-size:44px;
    font-weight:700;
    margin:2px 0 4px;
    color:var(--plum-dark);
    text-align:center;
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--sage);
    font-weight:700;
    margin-bottom:2px;
  }

  .bio{
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.5;
    max-width:340px;
    margin:0 0 30px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    background:#fffdf8;
    border:1.5px solid var(--paper-line);
    border-radius:var(--radius);
    text-decoration:none;
    color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .link-card:nth-child(odd){ transform:rotate(-0.6deg); }
  .link-card:nth-child(even){ transform:rotate(0.6deg); }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-3px) rotate(0deg);
    box-shadow:0 16px 34px -14px rgba(44,39,51,0.32);
    border-color:var(--plum);
    outline:none;
  }

  .link-icon{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .link-icon svg{ width:22px; height:22px; }

  .link-text{ flex:1 1 auto; min-width:0; }
  .link-label{ font-weight:700; font-size:15.5px; }
  .link-sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .link-go{ flex:0 0 auto; color:var(--ink-soft); font-size:18px; }

  footer{
    margin-top:44px;
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="avatar-holder">
    <div class="tape"></div>
    <div class="avatar">SP</div>
  </div>
  <div class="eyebrow">papelaria &amp; personalizados</div>
  <h1 class="name">Phic Paper</h1>
  <p class="bio">Cadernos, adesivos e presentes feitos com carinho. Escolha por onde quer chegar até a gente 👇</p>

  <div class="links">
    <a class="link-card" href="https://shopee.com.br/phicpapelaria" target="_blank" rel="noopener noreferrer">

      </div>

    <a class="link-card" href="https://instagram.com/phicgrafica" target="_blank" rel="noopener noreferrer">

      <div class="link-icon" style="background:#4f9d5c">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 2a8 8 0 1 1 0 16 7.9 7.9 0 0 1-4-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4zm4.4 10.4c-.2.6-1.2 1.1-1.6 1.1-.4 0-1 .1-3-.7-2.6-1-4.2-3.6-4.4-3.8-.1-.2-1-1.4-1-2.6s.6-1.9.8-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .5.4l.7 1.8c.1.2.1.3 0 .5l-.4.5c-.1.2-.2.3-.1.5.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.2.1.4.1.5-.1l.6-.7c.2-.2.3-.2.5-.1l1.7.9c.2.1.3.2.3.4 0 .2 0 .8-.2 1.4z"/></svg>
      </div>
      <div class="link-text">
        <div class="link-label">Falar no WhatsApp</div>

      </div>
      <div class="link-go">↗</div>
    </a>
  </div>

  <footer>feito com 📎</footer>
</div>

</body>
</html>
